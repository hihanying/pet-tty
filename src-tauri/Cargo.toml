[package]
name = "petdeck"
version = "0.3.2"
description = "Desktop pet for Claude Code — progress, tasks, mood"
authors = ["PetDeck"]
edition = "2021"

[lib]
name = "petdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 透明窗口（transparent: true）必需
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
